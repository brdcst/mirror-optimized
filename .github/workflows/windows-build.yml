# Windows x64 build of this fork, mirroring the upstream Eden-CI MSVC job
name: Windows Build

on:
  push:
    branches: [build/windows]
  workflow_dispatch:

jobs:
  msvc:
    name: MSVC amd64
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - name: Disable autocrlf
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up CPM cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache
          key: windows-amd64-cpm-${{ hashFiles('cpmfile.json', '**/cpmfile.json') }}
          restore-keys: windows-amd64-cpm-

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install LLVM/Clang
        uses: Nerixyz/install-llvm-action@feat/new-llvm-versions
        with:
          version: "22.1.4"
          env: true

      - name: Add LLVM to PATH
        shell: bash
        run: |
          echo "${LLVM_PATH}/bin" >> $GITHUB_PATH
          "${LLVM_PATH}/bin/clang-cl" --version

      - name: Install Vulkan SDK
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $Ver = "1.4.328.1"
          $Root = "C:/VulkanSDK/$Ver"
          $Exe = "vulkansdk-windows-X64-$Ver.exe"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$Ver/windows/$Exe" -OutFile $Exe
          $p = Start-Process -FilePath "./$Exe" -NoNewWindow -PassThru -Wait -ArgumentList "--root `"$Root`" --accept-licenses --default-answer --confirm-command install"
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          echo "VULKAN_SDK=$Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$Root/Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        shell: bash
        run: |
          if [ -d .patch/boost ]; then dos2unix .patch/boost/*; fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl \
            -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF \
            -DYUZU_USE_BUNDLED_QT=ON \
            -DYUZU_USE_QT_MULTIMEDIA=OFF -DYUZU_USE_QT_WEB_ENGINE=OFF \
            -DENABLE_QT_TRANSLATION=ON \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DUSE_DISCORD_PRESENCE=ON \
            -DENABLE_LTO=OFF \
            -DYUZU_USE_BUNDLED_SIRIT=ON \
            -DYUZU_USE_BUNDLED_FFMPEG=ON \
            -DYUZU_USE_BUNDLED_OPENSSL=ON \
            -DYUZU_USE_BUNDLED_SDL3=ON -DYUZU_USE_BUNDLED_SDL2=ON \
            -DYUZU_DISABLE_LLVM=ON \
            -DYUZU_STATIC_BUILD=ON \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM_STANDALONE=OFF

      - name: Build
        shell: bash
        run: cmake --build build

      - name: Package
        shell: bash
        run: |
          mkdir -p pkg
          cp build/bin/*.exe pkg/
          cp build/bin/*.dll pkg/ 2>/dev/null || true
          cp LICENSE* README* pkg/
          ls -la pkg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eden-windows-amd64-${{ github.sha }}
          path: pkg/*
